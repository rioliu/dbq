<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="dbq">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- database cylinder -->
  <path d="M26 42 V88 a34 13 0 0 0 68 0 V42 Z" fill="url(#body)"/>
  <path d="M26 65 a34 13 0 0 0 68 0" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.3"/>
  <ellipse cx="60" cy="42" rx="34" ry="13" fill="#5eead4"/>

  <!-- terminal prompt: > _ -->
  <path d="M84 99 L97 110 L84 121" fill="none" stroke="#4ade80" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 119 H119" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
</svg>
