# Build cross-platform binaries and publish a GitHub release when a v* tag
# is pushed.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # all deps are pure Go (incl. modernc sqlite) - static binaries
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          name="dbq_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags="-s -w" -o "dist/$name/dbq$ext" .
          cp LICENSE "dist/$name/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: dbq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum dbq_* > checksums.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-run of the workflow: refresh assets instead of failing
            gh release upload "$GITHUB_REF_NAME" dbq_* checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dbq_* checksums.txt \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
